  .btn:active { transform: translateY(1px); }
  .frame { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }

  footer { color: var(--muted); font-size: 0.82rem; text-align: center; margin-top: 22px; }
